[package]
name = "promptagotchi"
version = "0.2.0"
description = "A tiny pixel desk pet that keeps an eye on every Claude Code session."
authors = ["AloeVeraZ"]
license = "MIT"
edition = "2021"

[lib]
name = "promptagotchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
libc = "0.2.191"
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-nspanel = "2.1.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-single-instance = "2.5.5"
tiny_http = "0.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
